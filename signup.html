<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASHA Registration | SwasthyaSaathi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card" style="max-width:460px;">
    <div class="auth-brand">
      <div class="brand-mark" style="width:52px;height:52px;font-size:19px;">SS</div>
      <div>
        <div class="brand-name-hi" style="font-size:19px;" data-i18n="brand_hi">स्वास्थ्यसाथी</div>
      </div>
      <div class="lang-switch" style="margin-top:10px;"><button data-lang="en">EN</button><button data-lang="hi">हिन्दी</button></div>
    </div>

    <h1 class="text-section-title" style="text-align:center;margin-bottom:2px;" data-i18n="signup_title">ASHA Registration</h1>
    <p class="text-meta" style="text-align:center;margin-bottom:20px;" data-i18n="signup_sub">Public registration is for ASHA workers only</p>

    <div id="signupSuccess" class="alert alert-success hidden" style="margin-bottom:16px;">
      <span data-i18n="signup_pending_note"></span>
    </div>
    <div id="signupAlert" class="alert alert-danger hidden" style="margin-bottom:16px;"></div>

    <form id="signupForm" novalidate>
      <div class="field" id="f_name">
        <label for="name" data-i18n="full_name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field" id="f_mobile">
        <label for="mobile" data-i18n="mobile_number">Mobile Number</label>
        <input type="tel" id="mobile" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX" required>
        <div class="error-text" id="mobileErr" data-i18n="something_wrong"></div>
      </div>
      <div class="form-grid cols-2">
        <div class="field" id="f_password">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" required minlength="8">
          <div class="hint">8+ characters</div>
        </div>
        <div class="field" id="f_confirm">
          <label for="confirm" data-i18n="confirm_password">Confirm Password</label>
          <input type="password" id="confirm" required minlength="8">
        </div>
      </div>
      <div class="field" id="f_district">
        <label for="district" data-i18n="district">District</label>
        <input type="text" id="district" required>
      </div>
      <div class="form-grid cols-2">
        <div class="field" id="f_block">
          <label for="block" data-i18n="block">Block</label>
          <input type="text" id="block" required>
        </div>
        <div class="field" id="f_village">
          <label for="village" data-i18n="village">Village / Area</label>
          <input type="text" id="village" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="signupSubmit">
        <span data-i18n="create_account">Create Account</span>
      </button>
    </form>

    <div style="border-top:1px solid var(--color-border);margin-top:20px;padding-top:16px;text-align:center;">
      <span class="text-meta" data-i18n="have_account">Already have an account?</span>
      <a href="login.html" style="color:var(--color-primary-dark);font-weight:600;font-size:14px;margin-left:4px;" data-i18n="back_to_login">Back to login</a>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/translations.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('signupForm');
  const alertBox = document.getElementById('signupAlert');
  const successBox = document.getElementById('signupSuccess');
  const submitBtn = document.getElementById('signupSubmit');

  const fieldErrors = {
    name: I18N.current==='hi' ? 'कृपया अपना पूरा नाम दर्ज करें' : 'Please enter your full name',
    mobile: I18N.current==='hi' ? 'कृपया मान्य 10 अंकों का मोबाइल नंबर दर्ज करें' : 'Please enter a valid 10-digit mobile number',
    password: I18N.current==='hi' ? 'पासवर्ड कम से कम 8 अक्षरों का होना चाहिए' : 'Password must be at least 8 characters',
    confirm: I18N.current==='hi' ? 'पासवर्ड मेल नहीं खाते' : 'Passwords do not match',
    location: I18N.current==='hi' ? 'कृपया जिला, ब्लॉक और गांव भरें' : 'Please fill district, block and village',
    duplicate: I18N.current==='hi' ? 'यह मोबाइल नंबर पहले से पंजीकृत है' : 'This mobile number is already registered',
    server: I18N.t('something_wrong'),
  };

  function clearErrors(){
    ['f_name','f_mobile','f_password','f_confirm'].forEach(id=>document.getElementById(id).classList.remove('has-error'));
    alertBox.classList.add('hidden');
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    clearErrors();
    successBox.classList.add('hidden');

    const fields = {
      name: document.getElementById('name').value.trim(),
      mobile: document.getElementById('mobile').value.trim(),
      password: document.getElementById('password').value,
      confirmPassword: document.getElementById('confirm').value,
      district: document.getElementById('district').value.trim(),
      block: document.getElementById('block').value.trim(),
      village: document.getElementById('village').value.trim(),
    };

    submitBtn.disabled = true;
    submitBtn.textContent = I18N.t('loading');
    const result = await AUTH.signup(fields);
    submitBtn.disabled = false;
    submitBtn.innerHTML = `<span data-i18n="create_account">${I18N.t('create_account')}</span>`;

    if(!result.ok){
      const map = { name:'f_name', mobile:'f_mobile', password:'f_password', confirm:'f_confirm' };
      if(map[result.error]) document.getElementById(map[result.error]).classList.add('has-error');
      alertBox.textContent = fieldErrors[result.error] || fieldErrors.server;
      alertBox.classList.remove('hidden');
      return;
    }

    successBox.classList.remove('hidden');
    successBox.querySelector('span').textContent = I18N.t('signup_pending_note');
    form.reset();
    APP.toast(I18N.t('saved_successfully'), 'success');
  });
</script>
</body>
</html>
